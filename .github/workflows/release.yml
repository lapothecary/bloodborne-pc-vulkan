name: Publish Prebuilt Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package prebuilt Linux x86_64 archive
        run: |
          tar --exclude='__pycache__' -czf bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz \
            play.sh launcher.sh run.sh Launcher.py run.py bin \
            scripts patches launcher \
            out/bb-probe out/bb-gpu-capabilities \
            out/libbbport_dlss.so out/libnvidia-ngx-dlss.so.310.9.1 \
            out/gpu/libbbgpu.so out/gpu/libbbnet20.so \
            fsr4_shaders
          sha256sum bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz > bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

      - name: Create or Update GitHub Release (Linux x86_64)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.3' }}
          name: "Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.3' }}"
          body: |
            ## Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.3' }} (Windows & Linux `x86_64`)

            ### Quick Start
            - **Windows 10/11**: Extract `bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip` next to your `CUSA03173` (`v1.09`) folder and run **`Bloodborne.exe`** (or **`Launcher.exe`**).
            - **Linux**: Extract `bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz` next to your `CUSA03173` (`v1.09`) folder and run **`./play.sh`** (or **`./launcher.sh`**).

            ### What Changed in `${{ github.ref_name || 'v1.1.3' }}`:
            - **100% Local-Light Tile Batching (`84/84` Shaders), VSM Shadow Memoization & Stationary Velocity Culling (`Stages 8–11`, `113` Native GLSL 460 Shaders):**
              - **Deferred Local-Light Tile Batching (`LightTileBatcher` + `vs_8747a367` + SPIR-V `ltb2`/`opt32` Prologue):** Coalesces `64x64` deferred local-light tile quads across **all `84/84` (`100%`)** local-light `GXLightAcc` shaders (`34` native GLSL 460 shaders + `50` SPIR-V-instrumented `GXLightAcc_*.ppo` spot/shadowed/clip permutations including `GXLightAcc_DSpotLightShadowed1.ppo`), cutting total scene draws by `40–55%` and eliminating mid-pass batch flushes in Central Yharnam & Cathedral Ward.
              - **Stationary Object-Velocity Culling (`ObjectVelocityCuller`):** Skips stationary world & skinned meshes in the `1280x720` Object-Velocity pass via a 3-tier SSE2 matrix-palette cache (`-220..295 draws/frame` in Central Yharnam Bonfire Plaza, `-50%` GPU Motion Blur cost) while preserving moving characters and silhouette masks.
              - **Local VSM Shadow & 13-Tap Blur Memoization (`VsmShadowMemo`):** Memoizes unchanged `R16G16Sfloat` local shadow faces and skips redundant `Sample13Weight` blur passes (`92%` hit rate).
              - **Scaleform UI & Particle Quad Coalescing (`VfxUiBatcher` + `vs_24042a9b`):** Batches consecutive UI & particle draws with `0` task flushes (`opt32` shader cache).
            - **Hybrid `6P+E` & `6-Core` CPU `Stage A` Isolation + Long-Session VMA TLB:**
              - Isolates `bb:GpuComm` (`Stage A`) onto its own dedicated P-core / physical core (SMT sibling idle) on `6P+E` Intel CPUs (`i7-13620H`, `i7-12700H`, `i5-13600K`, `i5-14600K`) and 6-core Ryzen/Intel CPUs on both Windows and Linux so Havok/GX workers never preempt `Stage A`.
              - Replaced linear cache invalidations on `>32 KiB` particle/ring buffer writes with `O(1)` `256 KiB` coarse epochs and upgraded `RegionCache` to a heap-allocated `1,024`-entry 4-way `2 MiB` TLB (`PT_TLS` reduced by `1 KiB`).
            - **Sun/Moon 4-Cascade CSM Shadow Fix, Windows 11 Per-Process VRAM & Honest External VSync Telemetry:**
              - Fixed missing player shadow and camera-following cascade seam when `Dynamic Shadows` is `Off` by decoupling local point/spot VSM shadows (`+0x296e`) from 4-cascade Sun/Moon CSM (`+0x296c` in `sub_229cb70`).
              - Fixed Windows 11 per-process `VRAM: X.XX GB (Sys Y.Y)` reporting (`nvmlProcessInfo_v2_t` + WDDM `VK_EXT_memory_budget` fallback for NVIDIA/AMD/Intel GPUs and Optimus laptops), guarded WDDM `GpuProfiler` timestamp queries against zero/out-of-order wraparound, and added honest `External VSync / Present Cap` detection + `15s Avg` reset on settings changes.
            - **Previously in `v1.1.2` / `v1.1.1`:** L3-co-located `Stage A -> Stage B -> VkRecorder` CPU pipeline, `80 B` delta `DrawPacket` compression, live `SSAO`/`SSR`/`DoF` toggles, high-FPS foliage sway (`HookFoliageSway`), and NVIDIA DXGI Flip-Model swapchain.
          files: |
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          cache: false
          update: true
          install: >-
            git
            zip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-python

      - name: Setup Windows Python 3.12 for PyInstaller
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Windows GPU Build (build_win32_gpu)
        uses: actions/cache@v4
        with:
          path: build_win32_gpu
          key: win32-gpu-build-v113-${{ hashFiles('gpu/CMakeLists.txt', 'src/**', 'dantelion_gx/build_win32/libbb_gx_engine_native.a', 'gpu/shim/**', 'gpu/games/**', 'gpu/platform/**', 'gpu/render/**', 'gpu/buffers/**', 'gpu/cp/**', 'gpu/shader/backend/spirv/**') }}
          restore-keys: |
            win32-gpu-build-v113-

      - name: Build Windows x86_64 bb-probe.exe & bb-gpu-capabilities.exe
        run: |
          echo "MSYS2_CLANG64_BIN=$(cygpath -w /clang64/bin)" >> "$GITHUB_ENV"
          cmd //c "if not exist D:\\a\\_temp\\msys64 mklink /J D:\\a\\_temp\\msys64 C:\\msys64" || true
          if [ ! -f dantelion_gx/build_win32/libbb_gx_engine_native.a ]; then
            python3 tools/build_gx_win32_coff.py
          fi
          if [ -f build_win32_gpu/build.ninja ] && ! grep -q "our_cpp_100000_source" build_win32_gpu/build.ninja; then
            find build_win32_gpu -type f \( -name "*.obj" -o -name "*.a" \) -exec touch {} +
            touch dantelion_gx/build_win32/libbb_gx_engine_native.a
            rm -f build_win32_gpu/include/bbgpu/shaders/*.h build_win32_gpu/include/bbgpu/shaders/*.spv
            find build_win32_gpu/CMakeFiles/bb-probe.dir -name "*.obj" -delete || true
            rm -f build_win32_gpu/CMakeFiles/bbgpu.dir/shim/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/games/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/gcn/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/textures/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/win32/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/avplayer/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/videoout/frame_stats.cpp.obj build_win32_gpu/CMakeFiles/bbgpu.dir/buffers/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/render/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/cp/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/shader/backend/spirv/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/upscale/*.obj build_win32_gpu/libbbgpu.a build_win32_gpu/bb-probe.exe build_win32_gpu/libbbgpu.dll
          else
            rm -rf build_win32_gpu
            if ! cmake -S gpu -B build_win32_gpu -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DBB_LTO=OFF -DBB_PGO=off -DBB_NET=OFF > cmake_win32.log 2>&1; then
              cat cmake_win32.log
              grep -E "CMake Error|error:|not found|Could NOT" cmake_win32.log | head -n 15 | while IFS= read -r line; do
                echo "::error::CMAKE: $line"
              done
              exit 1
            fi
            cat cmake_win32.log
          fi
          if ! ninja -C build_win32_gpu bb-probe > ninja_win32.log 2>&1; then
            tail -n 120 ninja_win32.log
            grep -E "error:|undefined symbol:|ld.lld: error:|FAILED:" ninja_win32.log | head -n 15 | while IFS= read -r line; do
              echo "::error::NINJA: $line"
            done
            exit 1
          fi
          if [ ! -f build_win32_gpu/bb-gpu-capabilities.exe ]; then
            clang -std=c11 -O2 -Wall -Wextra -I/clang64/include tools/gpu_capabilities.c \
              -L/clang64/lib -lvulkan-1 -lSDL3 -o build_win32_gpu/bb-gpu-capabilities.exe
          fi

      - name: Build Unified Python Launcher, DLSS 4.5 Bridge & Package ZIP
        shell: pwsh
        run: |
          python tools/package_win32_release.py

      - name: Upload Windows x86_64 Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.3' }}
          files: |
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip.sha256
