name: Publish Prebuilt Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package prebuilt Linux x86_64 archive
        run: |
          tar --exclude='__pycache__' -czf bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz \
            play.sh launcher.sh run.sh Launcher.py run.py bin \
            scripts patches launcher \
            out/bb-probe out/bb-gpu-capabilities \
            out/libbbport_dlss.so out/libnvidia-ngx-dlss.so.310.9.1 \
            out/gpu/libbbgpu.so out/gpu/libbbnet20.so \
            fsr4_shaders
          sha256sum bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz > bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

      - name: Create or Update GitHub Release (Linux x86_64)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.5' }}
          name: "Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.5' }}"
          body: |
            ## Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.5' }} (Windows & Linux `x86_64`)

            ### Quick Start
            - **Windows 10/11**: Extract `bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip` next to your `CUSA03173` (`v1.09`) folder and run **`Bloodborne.exe`** (or **`Launcher.exe`**).
            - **Linux**: Extract `bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz` next to your `CUSA03173` (`v1.09`) folder and run **`./play.sh`** (or **`./launcher.sh`**).

            ### What Changed in `${{ github.ref_name || 'v1.1.5' }}`:
            - **Dual-Stage Frame Pacing (`PacerWait` + Output `Present Pacing`) & Swapchain Starvation Fix (`Jit: 2.50 ms -> 0.01–0.15 ms`):**
              - **Monotonic Phase-Locked Guest Pacer (`HookPacerWait`, `0x2034964..0x2034c55`):** Replaced `SprjFlipper`'s relative `sceKernelUsleep` path (which lost its 30-slot catch-up accumulator when `[pacer + 0x268]` was cleared, causing persistent FPS cap sag such as `170 -> 145–155 FPS` after transient worker spikes) with an absolute deadline pacer (`CLOCK_MONOTONIC` + `TIMER_ABSTIME` + `PR_SET_TIMERSLACK=1ns` on Linux; `CREATE_WAITABLE_TIMER_HIGH_RESOLUTION` on Windows) with bounded 1-period phase catch-up.
              - **Phase-Locked Output `Present Pacing` & Direct `Flip` Delivery (`BB_PRESENT_PACE=1`):** Bypassed the intermediate `1000 Hz` `bb:Vblank` thread hop when unlocked (`Stage B -> bb:Present` directly) and added post-`WaitRendered` output presentation pacing on `bb:Present` for capped `Mailbox` / `Immediate` modes (automatically inactive for uncapped mode and `FIFO` VSync). Prevents variable per-frame CPU/GPU render times (`2.4 ms` vs `4.6 ms`) from causing early burst presents (`172–175 FPS` spikes) and uneven scanout intervals on fixed-refresh displays (`p50 = 5.87 ms`, `p95 = 5.88 ms`, `0` `>1.5x` frame spikes at `170 FPS`).
              - **`5`-Image `Mailbox` / `Immediate` Swapchain & Debt-Conserving `sim_dt` Stabilizer (`BB_CAP_DT_STABILIZE=1`):** Raised the requested `Mailbox` / `Immediate` swapchain image count from `3` to `5` (clamped to surface capabilities) to prevent `vkAcquireNextImageKHR` compositor starvation when `FPS == Monitor Hz`, and added a zero-drift debt-conserving `dt` stabilizer around `1 / Cap` in `FrameStep`.
            - **Event-Driven `1000+ Hz` Mouse Input & Lock-Free Overlay Fast-Path:**
              - **Zero-Quantum Window Event Loop:** Replaced the fixed `SDL_Delay(2)` poll sleep on `bb:window` with `SDL_WaitEventTimeout` (`4 ms` housekeeping interval), removing `2` vs `3` mouse-batch beat aliasing per frame at high refresh rates while preserving native `ChrCam` radian camera injection (`InstallLookHook`).
              - **Eliminated `imgui_mutex` Contention on Raw Mouse Motion:** Added lock-free fast-exits in `BbOverlay::HandleEvent` and `BbOverlay::UpdateTextInput` when the overlay menu is closed, preventing `1000+ Hz` `SDL_EVENT_MOUSE_MOTION` events on `bb:window` from blocking on `imgui_mutex` while `bb:Present` renders the ImGui HUD.
            - **`4–5×` Faster Location, Warp & Respawn Loading (`BB_FAST_LOAD=1`):**
              - **Host SIMD `zlib` Decompression Bridge (`11/11` Guest Detours, `0x03a77c0..0x03a9a95` & `0x2067850..0x2069815`):** Redirected both statically linked PS4 scalar `zlib` copies (`1.2.7` for Scaleform `.gfx` / PNG / `DLZlibReader` and `1.2.3` for all `.dcx` `DCP\0DFLT` & `DCP\0EDGE` archives) to host SIMD `zlib` (`zlib-ng` / `zlib1`) through a `0x70`-byte LP64 `GuestZStream` bridge compatible with all 11 compiler-inlined `inflateEnd` sites (`+0x40` window slot), and upgraded `DcxDfltDecompressor`'s streaming read chunk from `16 KiB` to `64 KiB` (`0x262603d`).
              - **`500 Hz` Non-3D Loading-Screen Pacer & `Core.Res.*` Fast-Core Routing:** Temporarily lifts the guest frame-pacer cap to `500 Hz` (`2.0 ms` ticks) and bypasses redundant swapchain fence waits during non-3D loading bursts (`<= 160` draws + active `.dcx` decompression), while routing `Core.Res.PostProcessor` decompression workers onto fast `game_workers` cores — advancing FromSoftware's frame-coupled `FD4ResCap` loading state machine up to `4–5×` faster (`~11–12 s -> ~2.0–2.5 s` respawn reload) and locking back onto the exact user FPS cap the instant 3D rendering resumes.
              - **Non-Blocking Atomic Save Flushes (`SPRJ0005`):** Moved post-rename `fsync` / `FlushFileBuffers` durability syncs onto a dedicated background worker (drained synchronously on `Exit Game` and process exit), removing `8–10` synchronous disk-flush stalls per respawn or lamp warp.
            - **Title Screen `"Exit Game"` Option:** Added a native 6th row (**`Exit Game`** / **`Выйти из игры`**, localized across all supported game languages) at the bottom of the main Title Menu (`title*.gfx` in-memory `Item_5_0` slot + `BindCommandList` hook, with full mouse hover/click, keyboard, and gamepad navigation) to save settings and exit cleanly to desktop.
            - **Accurate Thread/Pacer Telemetry:** Measured `MOMainThread` active CPU execution directly via `CLOCK_THREAD_CPUTIME_ID` / `QueryThreadCycleTime` outside pacer sleep/spin, separated `ThreadSync` barrier waits from `FpsCapSleep`, and added 5-second `Pacing` (`min/p50/p95/p99/max`, `>1.25x`/`>1.5x`, `PresPace`, `SimDt`) and `Input` cadence diagnostics to `[HUD Telemetry]`.
            - **Previously in `v1.1.4`:** DirectVk `Stage A`/`Stage B` command stream overhaul (`decommission_pm4`), `SceneOcclusionCuller` 2.0 (`27–41%` G-Buffer culling at `0.00 ms` `Stage A` cost), and `123` native vectorized GLSL 460 shaders (`opt35`).
          files: |
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          cache: false
          update: true
          install: >-
            git
            zip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-python

      - name: Setup Windows Python 3.12 for PyInstaller
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Windows GPU Build (build_win32_gpu)
        uses: actions/cache@v4
        with:
          path: build_win32_gpu
          key: win32-gpu-build-v115-${{ hashFiles('gpu/CMakeLists.txt', 'src/**', 'dantelion_gx/build_win32/libbb_gx_engine_native.a', 'gpu/shim/**', 'gpu/games/**', 'gpu/platform/**', 'gpu/render/**', 'gpu/buffers/**', 'gpu/cp/**', 'gpu/vulkan/**', 'gpu/shader/backend/spirv/**') }}
          restore-keys: |
            win32-gpu-build-v115-
            win32-gpu-build-v114-
            win32-gpu-build-v113-

      - name: Build Windows x86_64 bb-probe.exe & bb-gpu-capabilities.exe
        run: |
          echo "MSYS2_CLANG64_BIN=$(cygpath -w /clang64/bin)" >> "$GITHUB_ENV"
          cmd //c "if not exist D:\\a\\_temp\\msys64 mklink /J D:\\a\\_temp\\msys64 C:\\msys64" || true
          if [ ! -f dantelion_gx/build_win32/libbb_gx_engine_native.a ]; then
            python3 tools/build_gx_win32_coff.py
          fi
          if [ -f build_win32_gpu/build.ninja ] && ! grep -q "our_cpp_100000_source" build_win32_gpu/build.ninja; then
            find build_win32_gpu -type f \( -name "*.obj" -o -name "*.a" \) -exec touch {} +
            touch gpu/CMakeLists.txt dantelion_gx/build_win32/libbb_gx_engine_native.a
            rm -f build_win32_gpu/include/bbgpu/shaders/*.h build_win32_gpu/include/bbgpu/shaders/*.spv
            find build_win32_gpu/CMakeFiles/bb-probe.dir -name "*.obj" -delete || true
            rm -f build_win32_gpu/CMakeFiles/bbgpu.dir/shim/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/games/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/gcn/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/textures/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/gnm/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/win32/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/avplayer/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/videoout/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/buffers/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/render/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/cp/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/vulkan/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/shader/backend/spirv/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/upscale/*.obj build_win32_gpu/libbbgpu.a build_win32_gpu/bb-probe.exe build_win32_gpu/libbbgpu.dll build_win32_gpu/bb-gpu-capabilities.exe
          else
            rm -rf build_win32_gpu
            if ! cmake -S gpu -B build_win32_gpu -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DBB_LTO=OFF -DBB_PGO=off -DBB_NET=OFF > cmake_win32.log 2>&1; then
              cat cmake_win32.log
              grep -E "CMake Error|error:|not found|Could NOT" cmake_win32.log | head -n 15 | while IFS= read -r line; do
                echo "::error::CMAKE: $line"
              done
              exit 1
            fi
            cat cmake_win32.log
          fi
          if ! ninja -C build_win32_gpu bb-probe > ninja_win32.log 2>&1; then
            tail -n 120 ninja_win32.log
            grep -E "error:|undefined symbol:|ld.lld: error:|FAILED:" ninja_win32.log | head -n 15 | while IFS= read -r line; do
              echo "::error::NINJA: $line"
            done
            exit 1
          fi
          if [ ! -f build_win32_gpu/bb-gpu-capabilities.exe ]; then
            clang -std=c11 -O2 -Wall -Wextra -I/clang64/include tools/gpu_capabilities.c \
              -L/clang64/lib -lvulkan-1 -lSDL3 -o build_win32_gpu/bb-gpu-capabilities.exe
          fi

      - name: Build Unified Python Launcher, DLSS 4.5 Bridge & Package ZIP
        shell: pwsh
        run: |
          python tools/package_win32_release.py

      - name: Upload Windows x86_64 Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.5' }}
          files: |
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip.sha256
