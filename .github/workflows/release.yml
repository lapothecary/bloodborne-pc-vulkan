name: Publish Prebuilt Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package prebuilt Linux x86_64 archive
        run: |
          tar --exclude='__pycache__' -czf bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz \
            play.sh launcher.sh run.sh Launcher.py run.py bin \
            scripts patches launcher \
            out/bb-probe out/bb-gpu-capabilities \
            out/libbbport_dlss.so out/libnvidia-ngx-dlss.so.310.9.1 \
            out/gpu/libbbgpu.so out/gpu/libbbnet20.so \
            fsr4_shaders
          sha256sum bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz > bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

      - name: Create or Update GitHub Release (Linux x86_64)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.2' }}
          name: "Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.2' }}"
          body: |
            ## Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.2' }} (Windows & Linux `x86_64`)

            ### Quick Start
            - **Windows 10/11**: Extract `bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip` next to your `CUSA03173` (`v1.09`) folder and run **`Bloodborne.exe`** (or **`Launcher.exe`**).
            - **Linux**: Extract `bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz` next to your `CUSA03173` (`v1.09`) folder and run **`./play.sh`** (or **`./launcher.sh`**).

            ### What Changed in `${{ github.ref_name || 'v1.1.2' }}`:
            - **L3-Co-Located `Stage A -> Stage B -> VkRecorder` CPU Pipeline & Frame-Pacing Overhaul:**
              - Pinned `Stage A` (`bb:GpuComm`), `Stage B` (`bb:DrawRec`), `bb:VkRecorder`, and `bb:Resolve0` onto dedicated physical cores inside the same L3/CCD domain (clearing SMT siblings and evacuating background child threads), cutting `Stage A` CPU time by `-69%` (`5.57 -> 1.74 ms`) and frame-pacing jitter by `3.5x` (`1.59 -> 0.30-0.45 ms`) in heavy `~1,780`-draw Cathedral Ward / Central Yharnam scenes.
              - Added value-aware register dirty tracking, delta `DrawPacket` compression (`136 -> 80 B` headers, deduplicated `flattened_ud_buf`, `vsharps`, and RT metadata), cross-RenderPass `PushDescriptor` / vertex-buffer preservation, and `O(1)` `UpdateDynamicState` epoch memoization on `Stage B`.
            - **Idle-Scene Motion Blur Skip & Accurate `F8` / `F9` Telemetry:**
              - Skips object/camera Motion Blur passes automatically when both the camera and 3-frame SIMD character bone deltas are stationary.
              - Added per-process VRAM reporting (`VRAM: X.XX GB (Sys Y.Y)`), separated intra-frame `HW GPU Mid-Frame Bubble` from `HW GPU Inter-Frame Wait`, added a 15-second `Avg %` column, and unclamped `CPU 1. Game Engine (Work)` & `FPS Cap Sleep`.
            - **Previously in `v1.1.1`:** Fixed `SSAO`, `SSR` & `DoF` initialization and live toggles (`System -> Effects`), Windows hardware occlusion culling & DXGI Flip-Model swapchain, frame-rate-independent grass/foliage wind sway (`HookFoliageSway`), split `CUSAxxxxx + CUSAxxxxx-patch` folder detection, and rebindable `Debug` (`F8`) / `Additional Debug` (`F9`) hotkeys.
          files: |
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          cache: false
          update: true
          install: >-
            git
            zip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-python

      - name: Setup Windows Python 3.12 for PyInstaller
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Windows GPU Build (build_win32_gpu)
        uses: actions/cache@v4
        with:
          path: build_win32_gpu
          key: win32-gpu-build-v111-${{ hashFiles('gpu/CMakeLists.txt', 'src/**', 'dantelion_gx/build_win32/libbb_gx_engine_native.a', 'gpu/shim/**', 'gpu/games/**', 'gpu/platform/**', 'gpu/render/**', 'gpu/buffers/**', 'gpu/cp/**', 'gpu/shader/backend/spirv/**') }}
          restore-keys: |
            win32-gpu-build-v111-

      - name: Build Windows x86_64 bb-probe.exe & bb-gpu-capabilities.exe
        run: |
          echo "MSYS2_CLANG64_BIN=$(cygpath -w /clang64/bin)" >> "$GITHUB_ENV"
          cmd //c "if not exist D:\\a\\_temp\\msys64 mklink /J D:\\a\\_temp\\msys64 C:\\msys64" || true
          if [ ! -f dantelion_gx/build_win32/libbb_gx_engine_native.a ]; then
            python3 tools/build_gx_win32_coff.py
          fi
          if [ -f build_win32_gpu/build.ninja ] && ! grep -q "our_cpp_100000_source" build_win32_gpu/build.ninja; then
            find build_win32_gpu -type f \( -name "*.obj" -o -name "*.a" -o -name "*.spv" -o -name "*.h" \) -exec touch {} +
            touch dantelion_gx/build_win32/libbb_gx_engine_native.a
            rm -f build_win32_gpu/include/bbgpu/shaders/ps_0ef50047_pbr_frag.h build_win32_gpu/include/bbgpu/shaders/ps_3fe9e964_frag.h build_win32_gpu/include/bbgpu/shaders/ps_6b42fc89_frag.h build_win32_gpu/include/bbgpu/shaders/ps_a22c7f71_pbr_frag.h build_win32_gpu/include/bbgpu/shaders/ps_d92266b9_pbr_frag.h build_win32_gpu/include/bbgpu/shaders/ps_e55e45eb_frag.h build_win32_gpu/include/bbgpu/shaders/ps_e96447c3_pbr_frag.h build_win32_gpu/include/bbgpu/shaders/ps_f55643de_frag.h
            find build_win32_gpu/CMakeFiles/bb-probe.dir -name "*.obj" -delete || true
            rm -f build_win32_gpu/CMakeFiles/bbgpu.dir/shim/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/games/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/gcn/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/textures/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/win32/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/avplayer/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/videoout/frame_stats.cpp.obj build_win32_gpu/CMakeFiles/bbgpu.dir/buffers/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/render/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/cp/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/shader/backend/spirv/native_shaders.cpp.obj build_win32_gpu/CMakeFiles/bbgpu.dir/upscale/*.obj build_win32_gpu/libbbgpu.a build_win32_gpu/bb-probe.exe build_win32_gpu/libbbgpu.dll
          else
            rm -rf build_win32_gpu
            if ! cmake -S gpu -B build_win32_gpu -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DBB_LTO=OFF -DBB_PGO=off -DBB_NET=OFF > cmake_win32.log 2>&1; then
              cat cmake_win32.log
              grep -E "CMake Error|error:|not found|Could NOT" cmake_win32.log | head -n 15 | while IFS= read -r line; do
                echo "::error::CMAKE: $line"
              done
              exit 1
            fi
            cat cmake_win32.log
          fi
          if ! ninja -C build_win32_gpu bb-probe > ninja_win32.log 2>&1; then
            tail -n 120 ninja_win32.log
            grep -E "error:|undefined symbol:|ld.lld: error:|FAILED:" ninja_win32.log | head -n 15 | while IFS= read -r line; do
              echo "::error::NINJA: $line"
            done
            exit 1
          fi
          if [ ! -f build_win32_gpu/bb-gpu-capabilities.exe ]; then
            clang -std=c11 -O2 -Wall -Wextra -I/clang64/include tools/gpu_capabilities.c \
              -L/clang64/lib -lvulkan-1 -lSDL3 -o build_win32_gpu/bb-gpu-capabilities.exe
          fi

      - name: Build Unified Python Launcher, DLSS 4.5 Bridge & Package ZIP
        shell: pwsh
        run: |
          python tools/package_win32_release.py

      - name: Upload Windows x86_64 Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.2' }}
          files: |
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip.sha256
