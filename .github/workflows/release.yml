name: Publish Prebuilt Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux x86_64 Build Dependencies (Ubuntu 24.04 baseline glibc 2.39)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential gcc-14 g++-14 clang ccache cmake ninja-build pkg-config patchelf git \
            libvulkan-dev glslang-tools spirv-tools \
            libfmt-dev libboost-dev robin-map-dev libxxhash-dev zlib1g-dev \
            libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libdbus-1-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libwebkit2gtk-4.1-dev libprotobuf-dev protobuf-compiler \
            nlohmann-json3-dev libssl-dev libminiupnpc-dev

      - name: Cache Portable Linux Third-Party Deps (Vulkan 1.4.365, SDL3, Zydis, VMA)
        id: cache-linux-deps
        uses: actions/cache@v4
        with:
          path: /opt/bb-deps
          key: linux-deps-v4-u2404-vk1.4.365-sdl3.2.10-zydis4.1.0-vma3.2.1

      - name: Build Portable Linux Deps (Vulkan 1.4.365 headers, SDL3, static Zydis, VMA)
        if: steps.cache-linux-deps.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/bb-deps && sudo chown "$USER:$USER" /opt/bb-deps
          mkdir -p /tmp/bb-deps-src /opt/bb-deps/include
          # 0. Vulkan 1.4.365 C + Hpp headers (matches toolchain VK_HEADER_VERSION 365 on Ubuntu 24.04 glibc baseline)
          git clone --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/bb-deps-src/vk-headers
          git clone --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Hpp.git /tmp/bb-deps-src/vk-hpp
          cp -r /tmp/bb-deps-src/vk-headers/include/vulkan /opt/bb-deps/include/
          cp -r /tmp/bb-deps-src/vk-headers/include/vk_video /opt/bb-deps/include/
          cp -f /tmp/bb-deps-src/vk-hpp/vulkan/*.hpp /opt/bb-deps/include/vulkan/
          # 1. VMA single header
          mkdir -p /opt/bb-deps/include/vma
          curl -sSL https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.2.1/include/vk_mem_alloc.h \
            -o /opt/bb-deps/include/vma/vk_mem_alloc.h
          # 2. Static Zycore + Zydis v4.1.0 (x86-64-v3, no AVX-512)
          git clone --depth 1 --branch v4.1.0 --recursive https://github.com/zyantific/zydis.git /tmp/bb-deps-src/zydis
          cmake -S /tmp/bb-deps-src/zydis/dependencies/zycore -B /tmp/bb-deps-src/zycore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/bb-deps \
            -DCMAKE_C_FLAGS="-O3 -march=x86-64-v3 -mtune=generic -mno-avx512f -fPIC" \
            -DZYCORE_BUILD_SHARED_LIB=OFF -DZYCORE_BUILD_EXAMPLES=OFF -DZYCORE_BUILD_TESTS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          ninja -C /tmp/bb-deps-src/zycore-build install
          cmake -S /tmp/bb-deps-src/zydis -B /tmp/bb-deps-src/zydis-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/bb-deps \
            -DCMAKE_PREFIX_PATH=/opt/bb-deps \
            -DCMAKE_C_FLAGS="-O3 -march=x86-64-v3 -mtune=generic -mno-avx512f -fPIC -I/opt/bb-deps/include" \
            -DZYAN_SYSTEM_ZYCORE=ON \
            -DZYDIS_BUILD_SHARED_LIB=OFF \
            -DZYDIS_BUILD_TOOLS=OFF -DZYDIS_BUILD_EXAMPLES=OFF -DZYDIS_BUILD_TESTS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          ninja -C /tmp/bb-deps-src/zydis-build install
          # 3. Shared SDL3 release-3.2.10 (x86-64-v3, no AVX-512)
          git clone --depth 1 --branch release-3.2.10 https://github.com/libsdl-org/SDL.git /tmp/bb-deps-src/sdl3
          cmake -S /tmp/bb-deps-src/sdl3 -B /tmp/bb-deps-src/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/bb-deps \
            -DCMAKE_C_FLAGS="-O3 -march=x86-64-v3 -mtune=generic -mno-avx512f" \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          ninja -C /tmp/bb-deps-src/sdl3/build install
          rm -rf /tmp/bb-deps-src

      - name: Cache Linux Compiler Objects (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: linux-ccache-v1-${{ github.sha }}
          restore-keys: |
            linux-ccache-v1-

      - name: Build Portable Linux x86-64-v3 Engine, GPU, Runtime & Launcher
        run: |
          export PKG_CONFIG_PATH="/opt/bb-deps/lib/pkgconfig:/opt/bb-deps/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="/opt/bb-deps:${CMAKE_PREFIX_PATH:-}"
          export LD_LIBRARY_PATH="/opt/bb-deps/lib:/opt/bb-deps/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_BASEDIR="$PWD"
          export CCACHE_NOHASHDIR=1
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=6
          export CCACHE_MAXSIZE=2G
          export CCACHE_SLOPPINESS="pch_defines,time_macros,include_file_mtime,include_file_ctime"
          ccache --zero-stats

          # 1. Native C++20 Dantelion2 GX Engine archive (x86-64-v3, no AVX-512)
          cmake -S dantelion_gx -B dantelion_gx/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ninja -C dantelion_gx/build bb_gx_engine_native

          # 2. Portable libbbgpu.so + libbbnet20.so (x86-64-v3, no AVX-512, gcc-14/g++-14)
          # Note: BB_LTO=OFF avoids GCC 14.2 lto1 ipa-icf ICE on FSR3/FSR4 ODR headers; Release gives -O3.
          rm -rf build_gpu out/gpu
          mkdir -p out/gpu
          cmake -S gpu -B build_gpu -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="/opt/bb-deps" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L/opt/bb-deps/lib -L/opt/bb-deps/lib/x86_64-linux-gnu" \
            -DVulkan_INCLUDE_DIR="/opt/bb-deps/include" \
            -DVMA_INCLUDE_DIR="/opt/bb-deps/include/vma" \
            -DBB_PORTABLE_ISA=ON -DBB_LTO=OFF -DBB_PGO=off -DBB_NET=ON
          targets="bbgpu"
          if grep -q "^build bbnet20:" build_gpu/build.ninja; then
            targets="$targets bbnet20"
          fi
          ninja -C build_gpu $targets
          cp -f build_gpu/libbbgpu.so out/gpu/
          if [ -f build_gpu/libbbnet20.so ]; then
            cp -f build_gpu/libbbnet20.so out/gpu/
          fi

          # 3. Portable bb-vulkan + bb-gpu-capabilities (Ubuntu 24.04 baseline crt1.o + x86-64-v3)
          rm -rf out/atrac9 out/libatrac9.a
          mkdir -p out/atrac9
          for src in third_party/LibAtrac9/C/src/*.c; do
            ccache gcc-14 -std=c99 -O2 -march=x86-64-v3 -mtune=generic -mno-avx512f -g -w -c "$src" \
              -o "out/atrac9/$(basename "${src%.c}").o"
          done
          ar rcs out/libatrac9.a out/atrac9/*.o
          read -r -a includes <<< "$(pkg-config --cflags vulkan sdl3)"
          read -r -a libraries <<< "$(pkg-config --libs vulkan sdl3)"
          gcc-14 -std=c11 -O2 -march=x86-64-v3 -mtune=generic -mno-avx512f -g -Wall -Wextra -Werror \
            -pthread -no-pie -I/opt/bb-deps/include "${includes[@]}" -I. -Isrc \
            src/probe.c src/runtime*.c src/vulkan_smoke.c out/libatrac9.a -lm \
            -Lout/gpu -lbbgpu -Wl,-rpath,'$ORIGIN/gpu' -rdynamic "${libraries[@]}" \
            -o out/bb-vulkan
          gcc-14 -std=c11 -O2 -march=x86-64-v3 -mtune=generic -mno-avx512f -Wall -Wextra -Werror \
            -I/opt/bb-deps/include "${includes[@]}" tools/gpu_capabilities.c "${libraries[@]}" \
            -o out/bb-gpu-capabilities

          # 4. Portable C++20 WebView Launcher (baseline x86-64)
          cmake -S launcher_v2 -B launcher_v2/build_ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ninja -C launcher_v2/build_ci
          cp -f launcher_v2/build_ci/bb-launcher out/bb-launcher
          chmod +x out/bb-launcher out/bb-vulkan out/bb-gpu-capabilities play.sh launcher.sh run.sh
          ccache --show-stats

          # 5. Bundle non-system .so deps & enforce ZERO x86-64-v4 / ZERO zmm / PT_TLS <= 0x124e8
          python3 tools/bundle_linux_deps.py

      - name: Package prebuilt Linux x86_64 archive
        run: |
          python3 launcher/bbport_updater.py --write-version .bbport-version.json
          tar --exclude='__pycache__' -czf bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz \
            .bbport-version.json \
            play.sh launcher.sh run.sh run.py bin \
            scripts patches launcher launcher_v2/ui \
            out/bb-launcher out/bb-vulkan out/bb-gpu-capabilities \
            out/libbbport_dlss.so out/libnvidia-ngx-dlss.so.310.9.1 \
            out/gpu/*.so* \
            fsr4_shaders data
          sha256sum bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz > bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256
          python3 launcher/bbport_updater.py --write-manifest \
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz \
            linux-manifest.json \
            .bbport-version.json

      - name: Prepare Release Notes from docs/release_notes.json
        run: |
          TAG="${GITHUB_REF_NAME:-v1.1.9}"
          python3 -c '
          import json, os
          tag = os.environ.get("TAG", "v1.1.9")
          notes = json.load(open("docs/release_notes.json", encoding="utf-8"))
          entry = notes.get(tag) or {"body": f"## Bloodborne PC Vulkan {tag} (Windows & Linux)\n"}
          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write(entry["body"])
          '
        env:
          TAG: ${{ github.ref_name || 'v1.1.9' }}

      - name: Create or Update GitHub Release (Linux x86_64)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.9' }}
          name: "Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.9' }}"
          body_path: release_body.md
          files: |
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256
            linux-manifest.json

  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          cache: true
          update: true
          install: >-
            git
            zip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-python

      - name: Setup Windows Python 3.12 for PyInstaller
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Windows Compiler Objects (ccache)
        uses: actions/cache@v4
        with:
          path: .ccache_win32
          key: win32-ccache-v1-${{ github.sha }}
          restore-keys: |
            win32-ccache-v1-

      - name: Cache Windows WebView2 SDK & Pip Wheels
        uses: actions/cache@v4
        with:
          path: |
            dist_win/webview2_sdk
            ~/AppData/Local/pip/Cache
          key: win32-packdeps-v1-py312-wv2-1.0.2903.40

      - name: Build Windows x86_64 Bloodborne.exe & bb-gpu-capabilities.exe
        run: |
          echo "MSYS2_CLANG64_BIN=$(cygpath -w /clang64/bin)" >> "$GITHUB_ENV"
          cmd //c "if not exist D:\\a\\_temp\\msys64 mklink /J D:\\a\\_temp\\msys64 C:\\msys64" || true
          export CCACHE_DIR="$(cygpath -m "$PWD/.ccache_win32")"
          export CCACHE_BASEDIR="$(cygpath -m "$PWD")"
          export CCACHE_NOHASHDIR=1
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=6
          export CCACHE_MAXSIZE=2G
          export CCACHE_SLOPPINESS="pch_defines,time_macros,include_file_mtime,include_file_ctime"
          ccache --zero-stats

          if [ ! -f dantelion_gx/build_win32/libbb_gx_engine_native.a ]; then
            python3 tools/build_gx_win32_coff.py
          fi
          rm -rf build_win32_gpu
          if ! cmake -S gpu -B build_win32_gpu -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBB_LTO=OFF -DBB_PGO=off -DBB_NET=OFF > cmake_win32.log 2>&1; then
            cat cmake_win32.log
            grep -E "CMake Error|error:|not found|Could NOT" cmake_win32.log | head -n 15 | while IFS= read -r line; do
              echo "::error::CMAKE: $line"
            done
            exit 1
          fi
          cat cmake_win32.log
          if ! ninja -C build_win32_gpu bb-probe > ninja_win32.log 2>&1; then
            tail -n 120 ninja_win32.log
            grep -E "error:|undefined symbol:|ld.lld: error:|FAILED:" ninja_win32.log | head -n 15 | while IFS= read -r line; do
              echo "::error::NINJA: $line"
            done
            exit 1
          fi
          clang -std=c11 -O2 -Wall -Wextra -I/clang64/include tools/gpu_capabilities.c \
            -L/clang64/lib -lvulkan-1 -lSDL3 -o build_win32_gpu/bb-gpu-capabilities.exe
          ccache --show-stats

      - name: Build Unified Python Launcher, DLSS 4.5 Bridge & Package ZIP
        shell: pwsh
        run: |
          python tools/package_win32_release.py

      - name: Upload Windows x86_64 Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.9' }}
          files: |
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip.sha256
            windows-manifest.json
