name: Publish Prebuilt Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package prebuilt Linux x86_64 archive
        run: |
          tar --exclude='__pycache__' -czf bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz \
            play.sh launcher.sh run.sh Launcher.py run.py bin \
            scripts patches launcher \
            out/bb-probe out/bb-gpu-capabilities \
            out/libbbport_dlss.so out/libnvidia-ngx-dlss.so.310.9.1 \
            out/gpu/libbbgpu.so out/gpu/libbbnet20.so \
            fsr4_shaders
          sha256sum bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz > bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

      - name: Create or Update GitHub Release (Linux x86_64)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.4' }}
          name: "Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.4' }}"
          body: |
            ## Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.4' }} (Windows & Linux `x86_64`)

            ### Quick Start
            - **Windows 10/11**: Extract `bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip` next to your `CUSA03173` (`v1.09`) folder and run **`Bloodborne.exe`** (or **`Launcher.exe`**).
            - **Linux**: Extract `bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz` next to your `CUSA03173` (`v1.09`) folder and run **`./play.sh`** (or **`./launcher.sh`**).

            ### What Changed in `${{ github.ref_name || 'v1.1.4' }}`:
            - **DirectVk Command Stream Overhaul (`Stage A` / `Stage B`) & `SceneOcclusionCuller` 2.0 (`+30–50%` Higher CPU-Bound FPS in Heavy Scenes):**
              - **Direct Command Stream & Zero-Heap `DrawPipe` (`decommission_pm4`):** Replaced legacy per-draw PM4/CE RAM scans and linear dirty-buffer checks on `Stage A` with direct `DirectVk` packet dispatch, `O(1)` `1 MiB` `PendingReads` + `64 KiB` Constant-Buffer write bitmasks, immutable `.flver` buffer fast-skip (`2b. Buffers & Ring` cut `3.5x` down to `0.11–0.14 ms`), inline zero-heap `CopyBatch` packets, and game-CCD L3 `GXWorker` thread topology (`Main ≈ Stage A ≈ GPU` parity with `0.00 ms` mid-frame GPU bubbles, plus opt-in `BB_MT_DIRECT_VK=1/2` secondary command buffer recording).
              - **`SceneOcclusionCuller` 2.0 (`27–41%` G-Buffer Culling + `45%` Distant Skeleton Culling at `0.00 ms` `Stage A` Cost):** Fixed `DirectBuffers` CPU-mirror constant resolution, added `7-MRT` (`DLAA` / `DLSS` / `FSR` / `TAA` motion-vector) G-Buffer support, added safe `>= 6.0m` 3D world-space occlusion culling for wall-occluded skeletal enemies (`-300+` draws/frame in Central Yharnam), and offloaded occlusion evaluation onto idle `Stage B` (`bb:DrawRec`) capacity while gating periodic `GpuProfiler` captures behind `BB_GPU_PROFILE=1`.
            - **123 Native GLSL 460 Shaders (`+10` New Shaders, `opt35`), Staggered CSM & Zero-Copy 4K Staging:**
              - **2-Sided Foliage & Cutout Overhaul (`GPU 2b`):** Added `4` native GLSL 460 FLVER G-Buffer vertex shaders (`vs_ddbe557e`, `vs_803b9d24`, `vs_b10c4f55`, `vs_e859b6d9` — `14/14` permutations, skipping zero-weight SSBO bone fetches) and uniform early-outs for detail maps & zero-weight IBL cubemap probes across two-sided foliage/cutout fragment shaders (`0.48 ms -> 0.16–0.32 ms`).
              - **Fullscreen Shadow, Fog & Yebis 2 Post-FX Shaders:** Added native GLSL 460 replacements for Screen-Space CSM PCF (`ps_11ffdfb5`), Atmospheric Fog (`ps_32e47788`), Yebis 2 Bokeh DoF (`ps_a2c4f30a`), Bloom/Glare Downsample & Starburst (`ps_e80526cc`, `ps_ff902740`, `cs_9a9cf8a9`), and Sun Cascade Shadow (`vs_3deaa573`), alongside staggered far-cascade CSM updates and zero-copy 4K asset staging (`VRAM: ~2.6–3.2 GB` at `1440p`, `0` Faults/s).
            - **Previously in `v1.1.3` / `v1.1.2`:** `100%` (`84/84`) `GXLightAcc` deferred local-light tile batching, `ObjectVelocityCuller`, `VsmShadowMemo`, hybrid `6P+E` / `6-core` `Stage A` isolation, live `SSAO`/`SSR`/`DoF` toggles, high-FPS foliage sway (`HookFoliageSway`), and NVIDIA DXGI Flip-Model swapchain.
          files: |
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          cache: false
          update: true
          install: >-
            git
            zip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-python

      - name: Setup Windows Python 3.12 for PyInstaller
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Windows GPU Build (build_win32_gpu)
        uses: actions/cache@v4
        with:
          path: build_win32_gpu
          key: win32-gpu-build-v114-${{ hashFiles('gpu/CMakeLists.txt', 'src/**', 'dantelion_gx/build_win32/libbb_gx_engine_native.a', 'gpu/shim/**', 'gpu/games/**', 'gpu/platform/**', 'gpu/render/**', 'gpu/buffers/**', 'gpu/cp/**', 'gpu/vulkan/**', 'gpu/shader/backend/spirv/**') }}
          restore-keys: |
            win32-gpu-build-v114-
            win32-gpu-build-v113-

      - name: Build Windows x86_64 bb-probe.exe & bb-gpu-capabilities.exe
        run: |
          echo "MSYS2_CLANG64_BIN=$(cygpath -w /clang64/bin)" >> "$GITHUB_ENV"
          cmd //c "if not exist D:\\a\\_temp\\msys64 mklink /J D:\\a\\_temp\\msys64 C:\\msys64" || true
          if [ ! -f dantelion_gx/build_win32/libbb_gx_engine_native.a ]; then
            python3 tools/build_gx_win32_coff.py
          fi
          if [ -f build_win32_gpu/build.ninja ] && ! grep -q "our_cpp_100000_source" build_win32_gpu/build.ninja; then
            find build_win32_gpu -type f \( -name "*.obj" -o -name "*.a" \) -exec touch {} +
            touch gpu/CMakeLists.txt dantelion_gx/build_win32/libbb_gx_engine_native.a
            rm -f build_win32_gpu/include/bbgpu/shaders/*.h build_win32_gpu/include/bbgpu/shaders/*.spv
            find build_win32_gpu/CMakeFiles/bb-probe.dir -name "*.obj" -delete || true
            rm -f build_win32_gpu/CMakeFiles/bbgpu.dir/shim/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/games/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/gcn/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/textures/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/gnm/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/win32/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/avplayer/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/videoout/frame_stats.cpp.obj build_win32_gpu/CMakeFiles/bbgpu.dir/buffers/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/render/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/cp/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/vulkan/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/shader/backend/spirv/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/upscale/*.obj build_win32_gpu/libbbgpu.a build_win32_gpu/bb-probe.exe build_win32_gpu/libbbgpu.dll build_win32_gpu/bb-gpu-capabilities.exe
          else
            rm -rf build_win32_gpu
            if ! cmake -S gpu -B build_win32_gpu -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DBB_LTO=OFF -DBB_PGO=off -DBB_NET=OFF > cmake_win32.log 2>&1; then
              cat cmake_win32.log
              grep -E "CMake Error|error:|not found|Could NOT" cmake_win32.log | head -n 15 | while IFS= read -r line; do
                echo "::error::CMAKE: $line"
              done
              exit 1
            fi
            cat cmake_win32.log
          fi
          if ! ninja -C build_win32_gpu bb-probe > ninja_win32.log 2>&1; then
            tail -n 120 ninja_win32.log
            grep -E "error:|undefined symbol:|ld.lld: error:|FAILED:" ninja_win32.log | head -n 15 | while IFS= read -r line; do
              echo "::error::NINJA: $line"
            done
            exit 1
          fi
          if [ ! -f build_win32_gpu/bb-gpu-capabilities.exe ]; then
            clang -std=c11 -O2 -Wall -Wextra -I/clang64/include tools/gpu_capabilities.c \
              -L/clang64/lib -lvulkan-1 -lSDL3 -o build_win32_gpu/bb-gpu-capabilities.exe
          fi

      - name: Build Unified Python Launcher, DLSS 4.5 Bridge & Package ZIP
        shell: pwsh
        run: |
          python tools/package_win32_release.py

      - name: Upload Windows x86_64 Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.4' }}
          files: |
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip.sha256
