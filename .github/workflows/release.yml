name: Publish Prebuilt Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package prebuilt Linux x86_64 archive
        run: |
          tar --exclude='__pycache__' -czf bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz \
            play.sh launcher.sh run.sh Launcher.py run.py bin \
            scripts patches launcher \
            out/bb-probe out/bb-gpu-capabilities \
            out/libbbport_dlss.so out/libnvidia-ngx-dlss.so.310.9.1 \
            out/gpu/libbbgpu.so out/gpu/libbbnet20.so \
            fsr4_shaders
          sha256sum bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz > bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

      - name: Create or Update GitHub Release (Linux x86_64)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.0' }}
          name: "Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.0' }} (Linux & Windows x86_64 Prebuilt — Up to 651 Avg FPS, 2,940 C++20 Engine + 109 Clean GLSL Shaders)"
          body: |
            ## Bloodborne PC Vulkan ${{ github.ref_name || 'v1.1.0' }} — Linux & Windows `x86_64` Prebuilt Release

            ### ⚡ 30-Second Quick Start (Just Unpack Next to `CUSA03173` & Play)
            - **Linux (`x86_64`)**: Download **`bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz`**, extract next to your **`CUSA03173`** (`v1.09` GOTY) folder, and run **`./play.sh`** (or **`python3 Launcher.py`** / **`./launcher.sh`**).
            - **Windows 10/11 (`x86_64`)**: Download **`bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip`**, extract next to your **`CUSA03173`** (`v1.09` GOTY) folder, and double-click **`Bloodborne.exe`** to launch the game directly (or **`Launcher.py`** / **`Launcher.exe`** for the settings launcher).
            - Press **`F8`** in-game to toggle the 10-pass hardware GPU/CPU telemetry HUD.

            ---

            ### 🔥 What's New in `${{ github.ref_name || 'v1.1.0' }}`:
            - **Native Windows 10/11 `x86_64` Port (`Bloodborne.exe` + `Launcher.py` / `Launcher.exe` + `bb-probe.exe`)**:
              - All `2,940 / 2,940` decompiled C++20 engine functions (`102,597` LOC) compiled into a zero-relocation Windows `COFF64` library (`libbb_gx_engine_native.a`) with explicit `sysv_abi` ↔ Win64 `ms_abi` bridge and Windows TEB `gs:[0x1480 + 8*slot]` guest TLS.
            - **Up to `666 Avg FPS (1.50 ms)` & `51.7%` Hardware Occlusion Culling at `2560×1440` Native**:
              - **Expanded `SceneOcclusionCuller` & Direct-Inline `Stage A` (`2a..2d`) Memoization**: Covers instanced G-Buffer world shaders (`vs_6a833138`, `vs_ecbef4c7`), static building palettes, and 6-MRT cutout/foliage draws (skipping up to **`51.7%` / `415 draws/frame`** of occluded geometry in heavy multi-room portals), paired with `O(1)` static `DirectBuffers` vertex memoization (`ResolveVertexBuffers` `1.63 -> 0.91 ms`) and `cueHeap` constant-buffer fast paths (`3.0–3.2 µs/draw`).
              - **`100% NatBuf` & `100% NatTex` (`0` Page Faults/s)**: `4 MiB` in-pass dynamic buffer renaming (`GXDynamicBufferRingOwner`), unified graphics push-descriptor `VkPipelineLayout` (`DscSav: 62%`), single-view private guest memory (`MAP_PRIVATE` / `VirtualAlloc2` `MEM_PRIVATE`), and dirty-gated `3×1025×1 R32F` gamma LUT uploads.
              - **Physical-Core #0 `MOMainThread` Isolation + Multi-CCD Worker Pool (`bbport_threads.h` / `posix_win32.cpp`)**: Reaches `154–170 FPS` in the heaviest multi-shadow indoor portals and `600–666+ FPS` in lighter areas at `2560×1440`.
              - **All `111` Core Shaders (`109` Unique Files) Rewritten in Clean, Vectorized Vulkan 1.3 GLSL 460 (`0` `tXXX` register dumps)**: Mathematically verified via `tools/verify_clean_glsl.py`, with genuine `gl_FrontFacing`, physical two-sided foliage subsurface translucency (`85%` backface transmission), exact quotient-rule CSM contact-shadow gradient in `ps_f55643de.frag` (fixing the Cascade 0/1 road seam), Lagarde `Specular AO`, Jimenez IGN volumetric godray dithering, and VSM Chebyshev light-bleeding suppression.
            - **7 Anti-Aliasing Modes, Upscalers, 3-State Window Mode & Zero-Pass `RCAS` Sharpening**:
              - Native **`DLAA 4 (Transformer Preset K)`**, **`DLAA 3 (CNN Fast Preset F)`**, **`SMAA T2x` (Morphological Ultra + 2x Motion-Vector Temporal Resolve)**, **`SMAA 1x Ultra` (`~0.16 ms`)**, `TAA`, `FXAA`, plus `DLSS 4.5 / 4`, `FSR 4`, and `FSR 3.1`.
              - **3-State Window Mode (`Fullscreen` / `Borderless Windowed` / `Windowed` + `Alt+Enter`)** & **Fused Zero-Pass `RCAS` Contrast-Adaptive Sharpening** inside `Presenter::EncodePass`.
            - **High-FPS Foliage/Cloth Physics, Controls & 21-Subpass X-Ray GPU/CPU Profiler HUD (`F8` / `F9`)**:
              - **Frame-Rate-Independent FLVER Foliage & Flower Sway (`HookFoliageSway` at `0x2313870`)** + **Havok Cloth Physics Stiffness Scaling above 30 FPS (`#58`)** + high-FPS `Mv_AudioPlayThread` startup handshake + save play-time carry + HUD item-icon stencil mask fix.
              - **Automatic Split Base + Update Folder Support (`CUSAxxxxx` + `CUSAxxxxx-patch`)**, **Cutscene Video Skipping (`Enter / Esc / Options`)**, & **Slow-Walk Key (`Left Alt`, `40%` speed)**.
              - **10-Category / 21-Subpass Hardware GPU & CPU X-Ray Breakdown (`F8` / `F9` HUD)**: Real-time `vkCmdWriteTimestamp2` timing for `Shadow Maps`, `G-Buffer`, `SSAO`, `Deferred PBR`, `SSR`, `Forward Alpha`, `Compute/HLE`, `Yebis 2 Post-FX`, `AA/Upscaler`, and `Scaleform UI & Present`, plus `CPU 2a..2e` Stage A breakdown and live `W / MHz / °C / VRAM` sensors.
          files: |
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          cache: false
          update: true
          install: >-
            git
            zip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-python

      - name: Setup Windows Python 3.12 for PyInstaller
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Windows GPU Build (build_win32_gpu)
        uses: actions/cache@v4
        with:
          path: build_win32_gpu
          key: win32-gpu-build-${{ hashFiles('gpu/CMakeLists.txt', 'src/**', 'gpu/shim/**', 'gpu/platform/**', 'gpu/render/**', 'gpu/buffers/**', 'gpu/cp/**', 'gpu/shader/backend/spirv/**') }}
          restore-keys: |
            win32-gpu-build-

      - name: Build Windows x86_64 bb-probe.exe & bb-gpu-capabilities.exe
        run: |
          echo "MSYS2_CLANG64_BIN=$(cygpath -w /clang64/bin)" >> "$GITHUB_ENV"
          cmd //c "if not exist D:\\a\\_temp\\msys64 mklink /J D:\\a\\_temp\\msys64 C:\\msys64" || true
          if [ ! -f our_cpp_100000_source/build_win32/libbb_gx_engine_native.a ]; then
            python3 tools/build_gx_win32_coff.py
          fi
          if [ -f build_win32_gpu/build.ninja ]; then
            find build_win32_gpu -type f \( -name "*.obj" -o -name "*.a" -o -name "*.spv" -o -name "*.h" \) -exec touch {} +
            rm -f build_win32_gpu/include/bbgpu/shaders/ps_0ef50047_pbr_frag.h build_win32_gpu/include/bbgpu/shaders/ps_3fe9e964_frag.h build_win32_gpu/include/bbgpu/shaders/ps_6b42fc89_frag.h build_win32_gpu/include/bbgpu/shaders/ps_a22c7f71_pbr_frag.h build_win32_gpu/include/bbgpu/shaders/ps_d92266b9_pbr_frag.h build_win32_gpu/include/bbgpu/shaders/ps_e55e45eb_frag.h build_win32_gpu/include/bbgpu/shaders/ps_e96447c3_pbr_frag.h build_win32_gpu/include/bbgpu/shaders/ps_f55643de_frag.h
            find build_win32_gpu/CMakeFiles/bb-probe.dir -name "*.obj" -delete || true
            rm -f build_win32_gpu/CMakeFiles/bbgpu.dir/shim/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/win32/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/avplayer/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/platform/videoout/frame_stats.cpp.obj build_win32_gpu/CMakeFiles/bbgpu.dir/buffers/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/render/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/cp/*.obj build_win32_gpu/CMakeFiles/bbgpu.dir/shader/backend/spirv/native_shaders.cpp.obj build_win32_gpu/CMakeFiles/bbgpu.dir/upscale/vk_temporal_upscaler.cpp.obj build_win32_gpu/libbbgpu.a build_win32_gpu/bb-probe.exe build_win32_gpu/libbbgpu.dll
          else
            if ! cmake -S gpu -B build_win32_gpu -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DBB_LTO=OFF -DBB_PGO=off -DBB_NET=OFF > cmake_win32.log 2>&1; then
              cat cmake_win32.log
              grep -E "CMake Error|error:|not found|Could NOT" cmake_win32.log | head -n 15 | while IFS= read -r line; do
                echo "::error::CMAKE: $line"
              done
              exit 1
            fi
            cat cmake_win32.log
          fi
          if ! ninja -C build_win32_gpu bb-probe > ninja_win32.log 2>&1; then
            tail -n 120 ninja_win32.log
            grep -E "error:|undefined symbol:|ld.lld: error:|FAILED:" ninja_win32.log | head -n 15 | while IFS= read -r line; do
              echo "::error::NINJA: $line"
            done
            exit 1
          fi
          if [ ! -f build_win32_gpu/bb-gpu-capabilities.exe ]; then
            clang -std=c11 -O2 -Wall -Wextra -I/clang64/include tools/gpu_capabilities.c \
              -L/clang64/lib -lvulkan-1 -lSDL3 -o build_win32_gpu/bb-gpu-capabilities.exe
          fi

      - name: Build Unified Python Launcher, DLSS 4.5 Bridge & Package ZIP
        shell: pwsh
        run: |
          python tools/package_win32_release.py

      - name: Upload Windows x86_64 Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1.0' }}
          files: |
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip
            bloodborne-pc-vulkan-windows-x86_64-prebuilt.zip.sha256
